# ~/.tmux.conf — configurazione ottimizzata per Raspberry Pi via SSH
# Copia questo file sul Pi come /home/alberto/.tmux.conf, poi riavvia tmux:
#   tmux kill-server && tmux
# (le sessioni attive verranno chiuse: salva il lavoro prima)

# --- Mouse ---
# Click per cambiare riquadro, scroll con la rotella, resize trascinando i bordi
set -g mouse on

# --- Riquadri e finestre ---
# Inizia a numerare finestre e riquadri da 1 (più comodo con i numeri tastiera)
set -g base-index 1
setw -g pane-base-index 1
# Renumerazione automatica quando chiudi una finestra
set -g renumber-windows on
# Nome finestra che segue il comando in esecuzione
set -g automatic-rename on
set -g set-titles on

# Comportamento pratico: le finestre nuove restano nella cartella corrente
# invece di tornare alla home
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Alt+freccia per spostarsi tra riquadri (senza dover premere Ctrl+b prima)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# | e - per dividere, più memorabili di % e "
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# r ricarica la config al volo: Ctrl+b r
bind r source-file ~/.tmux.conf \; display "Config ricaricata!"

# Tastiere vi-like opzionali: discommenta se preferisci hjkl alle frecce
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R

# --- Aspetto ---
# 256 colori (256color serve a vim/micro per non sembrare rotti)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Barra di stato: minimale, con host, finestre, ora
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour248"
set -g status-left-length 30
set -g status-left "#[fg=colour46,bold] #h #[default]| "
set -g status-right "#[fg=colour250]%d/%m %H:%M "
set -g status-right-length 30
setw -g window-status-current-style "fg=colour46,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g status-justify centre

# Bordi riquadri visibili
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour46"

# --- Comportamento ---
# Cronologia lunga: scrolla indietro senza perdere nulla (utile con mouse)
set -g history-limit 50000
# Se la sessione muore, tmux esce invece di restare appeso
set -g exit-empty on
# Ridimensionamento dei riquadri "aggressivo" quando le finestre cambiano
setw -g aggressive-resize on
# Messaggi di stato visibili più a lungo (2s invece di 750ms)
set -g display-time 2000
# Nessun ritardo per l'escape (fondamentale per vim/micro)
set -s escape-time 10
